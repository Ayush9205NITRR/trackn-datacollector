name: Tracxn sync

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD), default START_DATE / 1 Apr 2026 (FY27)"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - name: Sync Tracxn -> Airtable
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          # "Tracxn Database" base / table; override with the variables if they move.
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appQQ97d3jA6bwwb6' }}
          AIRTABLE_FUNDING_TABLE: ${{ vars.AIRTABLE_FUNDING_TABLE || 'tblyAvdZRaCCgLP94' }}
          START_DATE: ${{ inputs.since || vars.START_DATE || '2026-04-01' }}
        run: python -m collector sync
      - name: Commit snapshot and reports
        # Also after a failed Airtable upload, so the collected deals and raw actor
        # output (paid Apify runs) are kept; the next sync uploads them.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Tracxn sync $(date -u +%F)"
          git push
