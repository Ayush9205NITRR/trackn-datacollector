name: Tracxn sync

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD), default START_DATE / Jan 1"
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - name: Sync Tracxn -> Airtable
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          START_DATE: ${{ inputs.since || vars.START_DATE || '2026-01-01' }}
        run: python -m collector sync
      - name: Commit snapshot and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Tracxn sync $(date -u +%F)"
          git push
