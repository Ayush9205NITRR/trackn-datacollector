name: Inspect Apify actors

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print input schemas and last run logs
        run: python -m collector inspect
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
