name: Setup Airtable Schema (run once)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create Funding Rounds and Monthly Leaders tables
        run: python -m collector setup
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          # "Tracxn Database" base / table; override with the variables if they move.
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID || 'appQQ97d3jA6bwwb6' }}
          AIRTABLE_FUNDING_TABLE: ${{ vars.AIRTABLE_FUNDING_TABLE || 'tblyAvdZRaCCgLP94' }}
